<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="shortcut icon" href="img/icono.png" type="image/x-icon">
</head>
<body>
    <div class="contenido">
        <div class="imagen">
            <img src="img/thomas-le-pRJhn4MbsMM-unsplash.jpg" alt="">
        </div>
        
        <div class="formulario">
            <h1>Iniciar Sesión</h1>
            <span>Ingresa tu Correo y Contraseña</span>

            <div class="vista">
                <form action="" id="loginForm">
                    <div class="input">
                        <label for="email">Correo</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="input">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" required>
                    </div>
                </form>

                <p id="mensajeError" style="color: #d9534f; font-size: 0.9rem; margin-top: 8px;"></p>

                <div class="links">
                    <a href="forgot-password.html" class="link-olvido">Olvidé mi Contraseña</a>
                    <a href="register.html" class="link-registro">Registrarse</a>
                </div>
    
                <button type="submit" form="loginForm">Ingresar</button>
            </div>

            <a href="">Necesito Ayuda</a>
        </div>
    </div>
    <script src="js/app.js"></script>   
</body>
</html>
