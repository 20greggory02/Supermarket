<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperMarket</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo">
            <span>📦 StockFlow</span>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Buscar por nombre...">
            <button onclick="filterProducts()">Buscar</button>
        </div>

        <div class="links" id="authLinks">
            <a href="register.html">Registrate</a>
            <a href="login.html" id="estilizado">Iniciar Sesion</a>
        </div>

        <!-- Usuario: se muestra si HAY sesión iniciada -->
        <div class="links user-box oculto" id="userBox">
            <span class="user-name">👤 <span id="userName"></span></span>
            <button type="button" id="logoutBtn">Cerrar sesión</button>
        </div>

        <div class="cart-icon" id="cartIcon" onclick="scrollToCart()" title="Ver mi pedido" aria-label="Ver mi pedido">
            <svg class="cart-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1.003 1.003 0 0 0 20 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
            <span class="cart-badge empty" id="cartCount">0</span>
        </div>
    </header>

    <div class="main-container">
        <div class="catalog-section">
            <div class="promos-banner">
                <div>
                    <h3>🎃 🔥 Combo Mayorista del Mes</h3>
                    <p>🕷️ Lleva Combo de Abarrotes Especial con 15% de Descuento. 👻</p>
                </div>
                <button class="btn-promo" onclick="addPromoCombo()">Agregar Combo</button>
            </div>

            <div class="categories">
                <button class="category-btn active" onclick="filterCategory('Todos', this)">Todos</button>
                <button class="category-btn" onclick="filterCategory('Abarrotes', this)">Abarrotes</button>
                <button class="category-btn" onclick="filterCategory('Lácteos', this)">Lácteos</button>
                <button class="category-btn" onclick="filterCategory('Bebidas', this)">Bebidas</button>
                <button class="category-btn" onclick="filterCategory('Combos', this)">Combos</button>
            </div>

            <div class="products-grid" id="productsGrid">
                <!-- Se llena dinámicamente con JavaScript -->
            </div>
        </div>

        <div class="cart-summary" id="cartSection">
            <h3>Resumen del Pedido</h3>
            <div class="cart-list" id="cartList">
                <p class="empty-msg">Tu carrito está vacío</p>
            </div>
            <div class="cart-total">
                <span>Total Estimado:</span>
                <span id="cartTotal">$ 0</span>
            </div>
            <button class="btn-order" onclick="confirmOrder()">Confirmar Pedido Anticipado</button>
        </div>
    </div>

   <!-- Modal de Confirmación / Error del pedido -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <h2 id="modalTitle">¡Pedido Confirmado! 🎉</h2>
            <p id="modalMessage">Tu pedido ha sido recibido y enviado a la bodega para su preparación.</p>
            <ul class="modal-summary" id="modalSummary"></ul>
            <p class="modal-total" id="modalTotal"></p>
            <button onclick="closeModal()">Aceptar</button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/session.js"></script>
</body>
</html>
