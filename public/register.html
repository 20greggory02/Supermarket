<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="css/register.css">
    <link rel="shortcut icon" href="img/icono.png" type="image/x-icon">
</head>
<body>
    <div class="contenido">
        <div class="imagen">
            <img src="img/thomas-le-pRJhn4MbsMM-unsplash.jpg" alt="">
        </div>
        
        <div class="formulario">
            <h1>Registrate</h1>
            <span>Ingresa los siguientes datos</span>

            <div class="vista">
                <form action="" id="registerForm">
                    <div class="input">
                        <label for="name">Nombre</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="input">
                        <label for="email">Correo</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="input">
                        <label for="phone">Teléfono</label>
                        <input type="tel" id="phone" required>
                    </div>
                    <div class="input">
                        <label for="address">Dirección</label>
                        <input type="text" id="address" required>
                    </div>
                    <div class="input">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" required>
                    </div>
                    <div class="input">
                        <label for="confirmPassword">Confirmar Contraseña</label>
                        <input type="password" id="confirmPassword" required>
                    </div>
                </form>

                <p id="mensajeEstado" style="font-size: 0.9rem; margin-top: 8px;"></p>

                <div class="links">
                    <a href="login.html">Iniciar Sesión</a>
                </div>
    
                <button type="submit" form="registerForm">Registrarse</button>
            </div>

            <a href="">Necesito Ayuda</a>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
